name: Validate Agent Skills

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Skill validator dependencies
        run: python -m pip install --disable-pip-version-check --no-input skills-ref pyyaml

      - name: Validate Skill frontmatter and naming
        run: agentskills validate skills/hyperos4-rust-launcher-native-hook

      - name: Check Markdown links and repository invariants
        run: python scripts/validate_repo.py

      - name: Check whitespace
        run: git diff --check
